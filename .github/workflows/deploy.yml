name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you redeploy from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits rather than cancelling a live rollout.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Work out where the site is served from
        id: site
        run: |
          # A custom domain (public/CNAME) or a user page serves from the root;
          # a project page serves from /<repo>. Getting this wrong is what makes
          # a Pages deploy load with no CSS, so it is derived, not remembered.
          repo="${GITHUB_REPOSITORY#*/}"
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"

          if [ -f public/CNAME ]; then
            base=""
            url="https://$(tr -d '[:space:]' < public/CNAME)"
            echo "Custom domain — serving from the root of $url"
          elif [ "${repo,,}" = "${owner_lc}.github.io" ]; then
            base=""
            url="https://${owner_lc}.github.io"
            echo "User page — serving from the root of $url"
          else
            base="/$repo"
            url="https://${owner_lc}.github.io/$repo"
            echo "Project page — serving from $url"
          fi

          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.site.outputs.base }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.site.outputs.url }}
          # Analytics stays off until these are set, so no tracker ships by
          # default. Set them under Settings → Secrets and variables → Actions
          # → Variables — no code change needed.
          #   ANALYTICS          umami | plausible | ga4 | cloudflare
          #   UMAMI_ID           website id from Umami Cloud
          #   PLAUSIBLE_DOMAIN   the bare domain
          #   GA_ID              G-XXXXXXXXXX  (sets cookies — needs a banner)
          #   CF_BEACON          Cloudflare beacon token (page views only)
          NEXT_PUBLIC_ANALYTICS: ${{ vars.ANALYTICS }}
          NEXT_PUBLIC_UMAMI_ID: ${{ vars.UMAMI_ID }}
          NEXT_PUBLIC_UMAMI_SRC: ${{ vars.UMAMI_SRC }}
          NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.PLAUSIBLE_DOMAIN }}
          NEXT_PUBLIC_GA_ID: ${{ vars.GA_ID }}
          NEXT_PUBLIC_CF_BEACON: ${{ vars.CF_BEACON }}
          # The floating contact widget's mailer (EmailJS) — see README.md
          # ("Contact widget email") for how to connect Gmail and a template
          # in EmailJS's dashboard and get these three values.
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: ${{ vars.EMAILJS_SERVICE_ID }}
          NEXT_PUBLIC_EMAILJS_TEMPLATE_ID: ${{ vars.EMAILJS_TEMPLATE_ID }}
          NEXT_PUBLIC_EMAILJS_TEMPLATE_ID_CONFIRM: ${{ vars.EMAILJS_TEMPLATE_ID_CONFIRM }}
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: ${{ vars.EMAILJS_PUBLIC_KEY }}

      - name: Stop Pages running Jekyll over the export
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
